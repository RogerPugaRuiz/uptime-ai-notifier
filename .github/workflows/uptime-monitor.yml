name: Monitor de Uptime

on:
  # schedule:
    # Se ejecuta cada 15 minutos para no gastar los minutos gratis muy rápido
    # Si quieres cada 5 min, cambia a: '*/5 * * * *'
    # - cron: '*/5 * * * *'
  # Esto te permite ejecutarlo manualmente con un botón para probar ya mismo
  workflow_dispatch:

env:
  # Configura tu sitio web aquí o usa un secret TARGET_URL
  TARGET: ${{ secrets.TARGET_URL || 'https://google.com' }}

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar estado del sitio
        id: check
        run: |
          echo "--- Iniciando chequeo: $(date) ---"
          echo "Objetivo: $TARGET"

          # Hacemos la petición y guardamos el código HTTP (200, 404, 500, etc)
          # Con timeout de 30s y 2 reintentos para mayor robustez
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --retry 2 \
            "$TARGET")

          echo "Resultado: $HTTP_CODE"

          # Enviamos SIEMPRE al webhook (para logging completo)
          # Enviamos el JSON con la estructura que n8n espera
          if curl -L -X POST -H "Content-Type: application/json" \
            -d "{\"site\": \"$TARGET\", \"error_code\": \"$HTTP_CODE\", \"event\": \"site_down\", \"timestamp\": \"$(date)\"}" \
            --max-time 10 \
            --fail \
            --silent \
            ${{ secrets.WEBHOOK_URL }}; then
            echo "Datos enviados exitosamente a n8n"
          else
            echo "Error al enviar datos a n8n (webhook podría estar inaccesible)"
            exit 1
          fi

          echo "--- Chequeo finalizado ---"
