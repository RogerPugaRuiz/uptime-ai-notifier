version: '3.8'

services:
  # --- SERVICIO REPARADOR DE PERMISOS ---
  # Se inicia primero, arregla la carpeta y se apaga.
  fix-permissions:
    image: alpine:latest
    container_name: n8n-fix-permissions
    command: sh -c "chown -R 1000:1000 /home/node/.n8n && echo 'Permisos arreglados'"
    volumes:
      - n8n_data:/home/node/.n8n

  n8n:
    image: n8nio/n8n:latest
    container_name: uptime-ai-notifier-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=${TIMEZONE:-Europe/Madrid}
      - TZ=${TIMEZONE:-Europe/Madrid}
      - N8N_LOG_LEVEL=${LOG_LEVEL:-info}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      # Cola única: procesa webhooks de forma secuencial para evitar race conditions
      - EXECUTIONS_CONCURRENCY=1
      # Forzamos que n8n no intente aplicar migraciones si no es dueño
      - N8N_SKIP_WEBHOOK_DEREGISTRATION_ON_SHUTDOWN=true
      # Esta línea es la clave: desactiva el bloqueo estricto
      - N8N_BLOCK_FS_WRITE_ACCESS=false
      # Opcionalmente, puedes definir rutas permitidas específicamente (más seguro)
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - NODE_FUNCTION_ALLOW_EXTERNAL=buffer
    volumes:
      - n8n_data:/home/node/.n8n
      - ./monitor_states.json:/home/node/.n8n-files/monitor_states.json
    networks:
      - uptime-ai
    # Esto le dice a n8n: "No arranques hasta que el reparador termine con éxito"
    depends_on:
      fix-permissions:
        condition: service_completed_successfully

  # ═══════════════════════════════════════════════════════════════
  # MONITOR MULTI-SERVICIO
  # Un solo contenedor que monitorea todos los servicios definidos
  # en config/services.json
  # ═══════════════════════════════════════════════════════════════
  monitor:
    image: alpine:latest
    container_name: uptime-monitor
    restart: unless-stopped
    depends_on:
      - n8n
    networks:
      - uptime-ai
    environment:
      - WEBHOOK_URL=http://n8n:5678/webhook/monitor-alert
      - CHECK_INTERVAL=60
    volumes:
      - ./cron/monitor-multi.sh:/etc/monitor.sh
      - ./config/services.json:/etc/services.json:ro
    entrypoint: >
      sh -c "apk add --no-cache curl jq ca-certificates &&
             chmod +x /etc/monitor.sh &&
             sh /etc/monitor.sh"

volumes:
  n8n_data:
    driver: local

networks:
  uptime-ai:
    driver: bridge